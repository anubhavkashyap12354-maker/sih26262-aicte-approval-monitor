version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: aicte_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aicte_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aicte_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:postgres@db:5432/aicte_db
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aicte_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
