<!doctype html>
<html lang="en" data-theme="abyss">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>AICTE Approval &amp; Compliance Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root{--fd:'Space Grotesk',system-ui,sans-serif;--fb:'Manrope',system-ui,sans-serif}

[data-theme=daylight]{--bg:#f4f8fb;--panel:rgba(255,255,255,.75);--panel-glass:linear-gradient(135deg,rgba(255,255,255,.88) 0%,rgba(240,246,252,.7) 100%);--panel-highlight:inset 0 1px 1px 0 rgba(255,255,255,.85),inset 0 0 20px 0 rgba(20,86,214,.04);--glass-shadow:0 12px 32px 0 rgba(16,42,67,.08);--line:rgba(12,26,36,.13);--line-strong:rgba(12,26,36,.28);--text:#0c1a24;--muted:#4a5f69;--accent:#1456d6;--on:#fff;--bad:#c42b2b;--warn:#8a5a00;--ok:#16794a;color-scheme:light}

:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#gl{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:12px clamp(14px,4vw,48px);background:var(--panel-glass);backdrop-filter:blur(18px) saturate(180%);border-bottom:1px solid var(--line);box-shadow:var(--glass-shadow)}

select option{color:#000}button:hover,select:hover{border-color:var(--accent);transform:translateY(-1px)}button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.pri{background:var(--accent);color:var(--on);border-color:var(--accent);font-weight:600;box-shadow:0 4px 14px rgba(93,225,238,.35)}
main{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:28px clamp(14px,4vw,48px) 80px}
h1{font:600 clamp(30px,5vw,54px)/1.05 var(--fd);letter-spacing:-.02em;margin:10px 0 8px}h1 span{color:var(--accent)}
.sub{color:var(--muted);max-width:640px;margin:0 0 6px}.tag{font:500 11px ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

.glass:hover{border-color:var(--line-strong)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}.two{grid-template-columns:repeat(auto-fit,minmax(320px,1fr));margin-top:14px}
.k{font:600 36px var(--fd)}.k small{font:500 12px var(--fb);color:var(--muted);display:block}
h2{font:600 16px var(--fd);margin:0 0 12px}
.w{overflow-x:auto}table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}th{font:600 11px ui-monospace,monospace;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);background:rgba(0,0,0,.12);backdrop-filter:blur(8px)}[data-theme=daylight] th{background:rgba(255,255,255,.5)}td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle;transition:background-color .2s}tbody tr:hover td{background:rgba(93,225,238,.04)}
.p{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid currentColor;white-space:nowrap;backdrop-filter:blur(4px)}.bad{color:var(--bad)}.warn{color:var(--warn)}.ok{color:var(--ok)}
.st{display:inline-block;padding:2px 8px;margin-right:3px;border-radius:6px;border:1px solid var(--line);font-size:12px;color:var(--muted)}.st.on{background:var(--accent);color:var(--on);border-color:var(--accent);font-weight:600}.st.done{color:var(--ok)}

.note{color:var(--muted);font-size:12px;margin-top:14px}.row{display:flex;justify-content:space-between;gap:8px}
@media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
</style>
</head>
<body>
<canvas id="gl" aria-hidden="true"></canvas>
<header>
  <b>AICTE<i>.</i> Approval Monitor</b>
  <div class="ctl">
    <label class="tag" for="role">Role</label>
    <select id="role" aria-label="Role"><option value="Bureau">Bureau officer</option><option value="South">Regional · South</option><option value="North">Regional · North</option><option value="West">Regional · West</option><option value="East">Regional · East</option><option value="Committee">Committee (EVC / SAC)</option></select>
    <button id="th" aria-label="Toggle light or dark theme">Light / Dark</button>
  </div>
</header>
<main>
  <div class="tag">Demo data · as of 25 Oct 2026 · not live AICTE records</div>
  <h1>Every approval, every deadline,<br><span>one live view.</span></h1>
  <p class="sub">Routing, EVC scheduling, undertakings and lease validity with automatic alerts and escalation. Alerts support officers; decisions stay with the competent authority.</p>
  <nav id="nav" aria-label="Sections"></nav>
  <div id="view" aria-live="polite"></div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){

  ul().forEach(function(u){if(u.s<2)o.push({k:'Undertaking',i:u.inst,d:u.d,r:u.reg})});
  dl().forEach(function(u){if(u.s<2)o.push({k:'Document',i:u.inst,d:u.d,r:u.reg})});

  var top=items().slice(0,5).map(function(x){return '<tr><td>'+x.k+'</td><td>'+x.i+'</td><td>'+pill(x.d)+'</td><td>'+lvl(x.d)+'</td></tr>'}).join('');
  return '<div class="grid">'+k+'</div><div class="grid two"><div class="glass"><h2>Stage-wise pendency</h2>'+st+'</div><div class="glass"><h2>Region-wise processing</h2>'+rg+'</div></div><div class="glass" style="margin-top:14px"><h2>Most urgent</h2>'+table(['Item','Institution','Timeline','Escalation level'],[top])+'</div>'},
ap:function(){return '<div class="glass"><h2>Applications · automatic routing</h2>'+table(['ID','Institution','Route','Days in stage','Timeline','Action'],apps().map(function(a,j){var last=a.i===R[a.rt].length-1;

evc:function(){return '<div class="glass"><h2>EVC queue · scheduling and alerts</h2>'+table(['ID','Institution','Region','Visit due','Escalation'],evcs().sort(function(a,b){return a.evc-b.evc}).map(function(a){return '<tr><td>'+a.id+'</td><td>'+a.inst+'</td><td>'+a.reg+'</td><td>'+pill(a.evc)+'</td><td>'+lvl(a.evc)+'</td></tr>'}))+'<p class="note">Applications enter this queue automatically after preliminary scrutiny.</p></div>'},
un:function(){return '<div class="glass"><h2>Time-bound undertakings</h2>'+table(['Institution','Condition','Due','Status','Evidence'],ul().map(function(u,j){return '<tr><td>'+u.inst+'</td><td>'+u.t+'</td><td>'+(u.s<2?pill(u.d):'<span class="p ok">Closed</span>')+'</td><td>'+US[u.s]+'</td><td>'+(u.s<2?'<button data-a="un" data-i="'+U.indexOf(u)+'">'+(u.s===0?'Institution uploads':'Officer verifies')+'</button>':'—')+'</td></tr>'}))+'</div>'},
dc:function(){return '<div class="glass"><h2>Lease and document validity</h2>'+table(['Institution','Document','Expiry','Status','Renewal'],dl().map(function(u){return '<tr><td>'+u.inst+'</td><td>'+u.t+'</td><td>'+(u.s<2?pill(u.d):'<span class="p ok">Renewed</span>')+'</td><td>'+(u.d<0&&u.s<2?'Expired':US[u.s])+'</td><td>'+(u.s<2?'<button data-a="dc" data-i="'+D.indexOf(u)+'">'+(u.s===0?'Institution uploads':'Officer verifies')+'</button>':'—')+'</td></tr>'}))+'</div>'},

function render(){document.getElementById('view').innerHTML=V[tab]();
  Array.prototype.forEach.call(document.querySelectorAll('#nav button'),function(b){b.setAttribute('aria-pressed',String(b.dataset.t===tab))})}
var nav=document.getElementById('nav');
TABS.forEach(function(t){var b=document.createElement('button');b.dataset.t=t[0];b.textContent=t[1];b.onclick=function(){tab=t[0];render()};nav.appendChild(b)});

    else{var why=b.parentNode.querySelector('select').value;o.i=Math.max(0,o.i-1);o.age=0;log(o.id+': returned to '+stage(o)+' · reason: '+why)}}

  if(a==='sweep'){var n=items().filter(function(x){return x.d<=15});n.forEach(function(x){log(lvl(x.d).split(' ')[0]+' sent: '+x.k+' · '+x.i)});if(!n.length)log('Sweep: no pending alerts')}
  render()});
/* ---------- 3D: themed backdrop, drifting particles, stage rings ---------- */
var TH={abyss:{bg:'#02080c',c1:'#04202c',c2:'#0b5a6b',c3:'#7ff3ff',dots:'#7fe9ef',add:true},daylight:{bg:'#f4f8fb',c1:'#dbe9f6',c2:'#a9c8f2',c3:'#ffffff',dots:'#2f6fe0',add:false}};
var canvas=document.getElementById('gl'),reduced=matchMedia('(prefers-reduced-motion: reduce)').matches,renderer;

['bg','c1','c2','c3','dots'].forEach(function(k){cur[k]=new THREE.Color(TH.abyss[k]);tgt[k]=new THREE.Color(TH.abyss[k])});

var bgM=new THREE.ShaderMaterial({depthTest:false,depthWrite:false,uniforms:{uT:{value:0},uA:{value:1.6},uM:{value:new THREE.Vector2()},uBg:{value:cur.bg},uC1:{value:cur.c1},uC2:{value:cur.c2},uC3:{value:cur.c3}},
 vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.9999,1.0);}',
 fragmentShader:'varying vec2 vUv;uniform float uT,uA;uniform vec2 uM;uniform vec3 uBg,uC1,uC2,uC3;'+NZ+'void main(){vec2 p=(vUv-0.5)*vec2(uA,1.0)*2.2+uM*0.15;float t=uT*0.04;vec2 q=vec2(fbm(p+vec2(0.0,t)),fbm(p+vec2(5.2,1.3)-t));float f=fbm(p+3.0*q);vec3 c=mix(uBg,uC1,smoothstep(0.1,0.6,f));c=mix(c,uC2,smoothstep(0.45,0.95,f)*0.7);c+=uC3*pow(smoothstep(0.55,1.0,length(q)),3.0)*0.18;c*=1.0-0.4*smoothstep(0.35,1.1,length(vUv-0.5)*1.4);c+=(h21(gl_FragCoord.xy+uT)-0.5)/255.0;gl_FragColor=vec4(c,1.0);}'});
var bg=new THREE.Mesh(new THREE.PlaneGeometry(2,2),bgM);bg.frustumCulled=false;bg.renderOrder=-10;scene.add(bg);
var N=matchMedia('(pointer: coarse)').matches?300:700,pos=new Float32Array(N*3),sd=new Float32Array(N);
for(var i=0;i<N;i++){pos[i*3]=(Math.random()-.5)*16;pos[i*3+1]=(Math.random()-.5)*10;pos[i*3+2]=(Math.random()-.5)*14-1;sd[i]=Math.random()}
